  <title id="fig-title">The circle as a graph near two different points</title>
  <desc id="fig-desc">Two views of the unit circle. Near (0,1) the upper arc is the graph of y = the square root of 1 minus x squared and F_y = 2 is nonzero. Near (1,0) the tangent is vertical, F_y = 0, and the circle is not a graph over the x-axis.</desc>
