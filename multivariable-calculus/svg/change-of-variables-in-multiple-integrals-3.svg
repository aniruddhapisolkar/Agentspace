  <title id="fig-title">The unit disc mapped to an ellipse</title>
  <desc id="fig-desc">The unit disc in the uv-plane on the left is stretched by factors a and b to the ellipse x squared over a squared plus y squared over b squared equal 1 on the right. Radial lines and circles map to radial lines and similar ellipses, and the area changes from pi to pi a b.</desc>
