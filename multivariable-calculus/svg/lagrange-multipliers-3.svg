<svg xmlns="http://www.w3.org/2000/svg" width="340" height="240" viewBox="0 0 340 240" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
  <title id="fig-title">Two constraints and the span of their normals</title>
  <desc id="fig-desc">The planes x + y + z = 1 and x = y intersect in the feasible line x = y, z = 1 - 2x. At the minimiser (1/3,1/3,1/3) the gradient of f = x squared + y squared + z squared lies along the normal of the first plane, since its coefficient on the second normal is zero.</desc>
