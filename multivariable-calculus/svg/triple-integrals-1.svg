<svg xmlns="http://www.w3.org/2000/svg" width="340" height="258" viewBox="0 0 340 258" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
  <title id="fig-title">A box partitioned into sub-boxes</title>
  <desc id="fig-desc">The rectangular box B from a to b along x, c to d along y and e to g along z is divided by a grid into sub-boxes. One sub-box B ijk at the near top right corner is shaded, with a sample point inside and edge lengths delta x i, delta y j, delta z k, whose product is the volume element delta V ijk.</desc>
