  <title id="fig-title">Polar coordinates: a local inverse that repeats globally</title>
  <desc id="fig-desc">Left: the rectangle 0.5 &lt;= r &lt;= 1.5 and -pi/2 &lt; theta &lt; pi/2 in the (r,theta) plane. Right: its image, the right half-annulus. The Jacobian determinant is r, so the map is locally invertible for r &gt; 0, but theta and theta + 2 pi give the same point.</desc>
