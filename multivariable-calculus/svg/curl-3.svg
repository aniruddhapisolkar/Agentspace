  <text x="257" y="154" font-size="11" fill="#312F2F"><tspan>S</tspan><tspan dy="3" font-size="7.92">2</tspan></text>
  <text x="165" y="240" font-size="11" fill="#312F2F" text-anchor="middle"><tspan>C = &#8706;S</tspan><tspan dy="3" font-size="7.92">1</tspan><tspan> = &#8706;S</tspan><tspan dy="3" font-size="7.92">2</tspan></text>
  <text x="165" y="258" font-size="9" fill="#636060" text-anchor="middle">right-hand rule fixes the boundary orientation</text>
</svg>
