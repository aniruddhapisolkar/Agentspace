<svg xmlns="http://www.w3.org/2000/svg" width="340" height="214" viewBox="0 0 340 214" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
  <title id="fig-title">Three ways the implicit equation can fail to define a function</title>
  <desc id="fig-desc">Three zero sets at the origin with F_y = 0: an isolated point for x squared plus y squared, two crossing lines for x squared minus y squared, and a cusp for x squared minus y cubed. None defines a unique differentiable y as a function of x near the origin.</desc>
