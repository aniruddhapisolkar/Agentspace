<svg xmlns="http://www.w3.org/2000/svg" width="340" height="210" viewBox="0 0 340 210" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif">
  <title id="fig-title">A continuous graph with no tangent plane</title>
  <desc id="fig-desc">Left: the directions through the origin for z = xy over the square root of x squared plus y squared; the function is positive in two opposite sectors and negative in the other two. Right: along the axes z = 0, while along the diagonals z = r/2 and z = -r/2, so the slope at the origin depends on the direction.</desc>
  <rect width="340" height="210" fill="#FFFFFF"/>
