<svg xmlns="http://www.w3.org/2000/svg" width="340" height="252" viewBox="0 0 340 252" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
  <title id="fig-title">A rectangle partitioned into subrectangles</title>
  <desc id="fig-desc">The rectangle R from a to b along x and c to d along y is divided by dashed grid lines into subrectangles. One cell R ij is shaded, with a sample point (x star, y star) and side lengths delta x i and delta y j, whose product is the area element delta A ij.</desc>
  <rect width="340" height="252" fill="#FFFFFF"/>
  <rect x="77.0" y="61.0" width="174" height="116" fill="none" stroke="#BEB8B7" stroke-width="0.9"/>
  <line x1="135.0" y1="61.0" x2="135.0" y2="177.0" stroke="#BEB8B7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="193.0" y1="61.0" x2="193.0" y2="177.0" stroke="#BEB8B7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="77.0" y1="119.0" x2="251.0" y2="119.0" stroke="#BEB8B7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <rect x="135.0" y="61.0" width="58" height="58" fill="#E9E3E2" stroke="#312F2F" stroke-width="1.2"/>
  <line x1="30" y1="206" x2="286" y2="206" stroke="#BEB8B7" stroke-width="0.9"/><path d="M 286 206 L 280 208.4 L 280 203.6 Z" fill="#BEB8B7" stroke="none"/>
  <line x1="48" y1="236" x2="48" y2="38" stroke="#BEB8B7" stroke-width="0.9"/><path d="M 48 38 L 50.4 44 L 45.6 44 Z" fill="#BEB8B7" stroke="none"/>
  <line x1="77" y1="203" x2="77" y2="209" stroke="#636060" stroke-width="0.9"/>
  <text x="77" y="221" font-size="12" fill="#636060" text-anchor="middle">a</text>
  <line x1="251" y1="203" x2="251" y2="209" stroke="#636060" stroke-width="0.9"/>
  <text x="251" y="221" font-size="12" fill="#636060" text-anchor="middle">b</text>
  <line x1="45" y1="177" x2="51" y2="177" stroke="#636060" stroke-width="0.9"/>
  <text x="42" y="181" font-size="12" fill="#636060" text-anchor="end">c</text>
  <line x1="45" y1="61" x2="51" y2="61" stroke="#636060" stroke-width="0.9"/>
  <text x="42" y="65" font-size="12" fill="#636060" text-anchor="end">d</text>
  <text x="290" y="210" font-size="12" fill="#636060">x</text>
  <text x="44" y="34" font-size="12" fill="#636060" text-anchor="end">y</text>
  <circle cx="162.84" cy="88.84" r="3.1" fill="#312F2F"/>
  <line x1="162.84" y1="83.84" x2="156.84" y2="49" stroke="#636060" stroke-width="0.7"/>
  <text x="154.84" y="45" font-size="10.5" fill="#636060" text-anchor="middle" stroke="#FFFFFF" stroke-width="3" paint-order="stroke"><tspan>(</tspan><tspan>x</tspan><tspan dy="-4" font-size="7.56">*</tspan><tspan dy="3" font-size="6.93">ij</tspan><tspan dy="-3">, </tspan><tspan>y</tspan><tspan dy="-4" font-size="7.56">*</tspan><tspan dy="3" font-size="6.93">ij</tspan><tspan dy="-3">)</tspan></text>
  <line x1="200" y1="61" x2="200" y2="119" stroke="#636060" stroke-width="0.9"/>
  <line x1="197" y1="61" x2="203" y2="61" stroke="#636060" stroke-width="0.9"/>
  <line x1="197" y1="119" x2="203" y2="119" stroke="#636060" stroke-width="0.9"/>
  <text x="206" y="93" font-size="10" fill="#636060"><tspan>Δy</tspan><tspan dy="3" font-size="7">j</tspan></text>
  <line x1="135" y1="125" x2="193" y2="125" stroke="#636060" stroke-width="0.9"/>
  <line x1="135" y1="122" x2="135" y2="128" stroke="#636060" stroke-width="0.9"/>
  <line x1="193" y1="122" x2="193" y2="128" stroke="#636060" stroke-width="0.9"/>
  <text x="164" y="146" font-size="10" fill="#636060" text-anchor="middle"><tspan>Δx</tspan><tspan dy="3" font-size="7">i</tspan></text>
  <text x="140" y="75" font-size="10.5" fill="#312F2F" stroke="#FFFFFF" stroke-width="3" paint-order="stroke"><tspan>R</tspan><tspan dy="3" font-size="7.14">ij</tspan></text>
  <text x="18" y="244" font-size="11" fill="#636060">R = [a, b] × [c, d]</text>
  <text x="322" y="244" font-size="10.5" fill="#636060" text-anchor="end"><tspan>ΔA</tspan><tspan dy="3" font-size="7.14">ij</tspan><tspan> = Δx</tspan><tspan dy="3" font-size="7.14">i</tspan><tspan> Δy</tspan><tspan dy="3" font-size="7.14">j</tspan></text>
</svg>
