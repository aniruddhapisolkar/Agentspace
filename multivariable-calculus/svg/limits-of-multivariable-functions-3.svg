<svg xmlns="http://www.w3.org/2000/svg" width="340" height="250" viewBox="0 0 340 250" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif">
  <title id="fig-title">A ridge above the parabola defeats every line</title>
  <desc id="fig-desc">Contour map of z = x y squared over (x squared + y to the fourth). The level curves are the parabolas x = k y squared; the tallest, x = y squared, carries the value 1/2. Every straight line through the origin stays near the level 0. A section at y = 0.6 shows the ridge profile reaching 1/2.</desc>
