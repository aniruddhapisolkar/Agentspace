  <path d="M 65 192 C 85 116, 245 116, 265 192" fill="none" stroke="#312F2F" stroke-width="1.6"/>
  <path d="M 165 218 C 165 204, 165 180, 165 135" fill="none" stroke="#BEB8B7" stroke-width="0.8"/>
  <path d="M 65 192 A 100 26 0 0 1 265 192" fill="none" stroke="#BEB8B7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="241.57" y1="209.52" x2="261.63" y2="200.48" stroke="#312F2F" stroke-width="1.8"/><path d="M 261.63 200.48 L 257.15 205.14 L 255.18 200.76 Z" fill="#312F2F" stroke="none"/>
  <line x1="68.37" y1="200.48" x2="88.43" y2="209.52" stroke="#312F2F" stroke-width="1.8"/><path d="M 88.43 209.52 L 81.97 209.24 L 83.94 204.86 Z" fill="#312F2F" stroke="none"/>
  <line x1="140" y1="196" x2="140" y2="162" stroke="#312F2F" stroke-width="1.3"/><path d="M 140 162 L 142.4 168 L 137.6 168 Z" fill="#312F2F" stroke="none"/>
  <text x="134" y="160" font-size="11" fill="#312F2F" text-anchor="end"><tspan>n</tspan><tspan dy="3" font-size="7.92">1</tspan></text>
  <line x1="165" y1="135" x2="165" y2="102" stroke="#312F2F" stroke-width="1.3"/><path d="M 165 102 L 167.4 108 L 162.6 108 Z" fill="#312F2F" stroke="none"/>
  <text x="171" y="104" font-size="11" fill="#312F2F"><tspan>n</tspan><tspan dy="3" font-size="7.92">2</tspan></text>
  <line x1="212" y1="206" x2="228" y2="198" stroke="#636060" stroke-width="0.8"/>
  <text x="230" y="208" font-size="11" fill="#312F2F"><tspan>S</tspan><tspan dy="3" font-size="7.92">1</tspan></text>
