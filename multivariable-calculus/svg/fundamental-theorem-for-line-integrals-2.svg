<svg xmlns="http://www.w3.org/2000/svg" width="340" height="310" viewBox="0 0 340 310" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
  <title id="fig-title">Telescoping potential differences along a polygonal path</title>
  <desc id="fig-desc">A three-segment path from A to B with intermediate points, beside a column of potential differences in which the interior values cancel to leave f of B minus f of A.</desc>
  <rect width="340" height="310" fill="#FFFFFF"/>
  <line x1="38" y1="218" x2="96" y2="96" stroke="#312F2F" stroke-width="1.8"/>
  <line x1="64.85" y1="161.52" x2="69.15" y2="152.48" stroke="#312F2F" stroke-width="1.8"/><path d="M 69.15 152.48 L 68.74 158.93 L 64.4 156.87 Z" fill="#312F2F" stroke="none"/>
  <line x1="96" y1="96" x2="150" y2="166" stroke="#312F2F" stroke-width="1.8"/>
  <line x1="119.95" y1="127.04" x2="126.05" y2="134.96" stroke="#312F2F" stroke-width="1.8"/><path d="M 126.05 134.96 L 120.49 131.67 L 124.29 128.74 Z" fill="#312F2F" stroke="none"/>
  <line x1="150" y1="166" x2="202" y2="56" stroke="#312F2F" stroke-width="1.8"/>
  <line x1="173.86" y1="115.52" x2="178.14" y2="106.48" stroke="#312F2F" stroke-width="1.8"/><path d="M 178.14 106.48 L 177.74 112.93 L 173.4 110.88 Z" fill="#312F2F" stroke="none"/>
  <circle cx="38" cy="218" r="3.2" fill="#312F2F"/>
  <circle cx="96" cy="96" r="3.2" fill="#312F2F"/>
  <circle cx="150" cy="166" r="3.2" fill="#312F2F"/>
  <circle cx="202" cy="56" r="3.2" fill="#312F2F"/>
  <text x="32" y="230" font-size="11" fill="#312F2F" text-anchor="end">A</text>
  <text x="208" y="58" font-size="11" fill="#312F2F">B</text>
  <text x="103" y="90" font-size="10" fill="#636060"><tspan>P</tspan><tspan dy="3.2" font-size="7.2">1</tspan></text>
  <text x="157" y="179" font-size="10" fill="#636060"><tspan>P</tspan><tspan dy="3.2" font-size="7.2">2</tspan></text>
  <text x="218" y="94" font-size="10.5" fill="#312F2F"><tspan>f(P</tspan><tspan dy="3.2" font-size="7.56">1</tspan><tspan dy="-3.2">) − f(P</tspan><tspan dy="3.2" font-size="7.56">0</tspan><tspan dy="-3.2">)</tspan></text>
  <text x="218" y="129" font-size="10.5" fill="#312F2F"><tspan>+ f(P</tspan><tspan dy="3.2" font-size="7.56">2</tspan><tspan dy="-3.2">) − f(P</tspan><tspan dy="3.2" font-size="7.56">1</tspan><tspan dy="-3.2">)</tspan></text>
  <text x="218" y="164" font-size="10.5" fill="#312F2F"><tspan>+ f(P</tspan><tspan dy="3.2" font-size="7.56">3</tspan><tspan dy="-3.2">) − f(P</tspan><tspan dy="3.2" font-size="7.56">2</tspan><tspan dy="-3.2">)</tspan></text>
  <text x="218" y="216" font-size="10.5" fill="#312F2F"><tspan>= f(P</tspan><tspan dy="3.2" font-size="7.56">3</tspan><tspan dy="-3.2">) − f(P</tspan><tspan dy="3.2" font-size="7.56">0</tspan><tspan dy="-3.2">)</tspan></text>
  <text x="218" y="241" font-size="10.5" fill="#312F2F"><tspan>= f(B) − f(A)</tspan></text>
  <line x1="216" y1="178" x2="322" y2="178" stroke="#636060" stroke-width="0.9"/><line x1="216" y1="175" x2="216" y2="181" stroke="#636060" stroke-width="0.9"/><line x1="322" y1="175" x2="322" y2="181" stroke="#636060" stroke-width="0.9"/><text x="269" y="189" font-size="8.5" fill="#636060" text-anchor="middle">interior values cancel in pairs</text>
</svg>
