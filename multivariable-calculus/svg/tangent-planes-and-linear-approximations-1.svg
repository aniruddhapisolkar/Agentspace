<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 340 210" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Inter, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="fig-title">A continuous graph with no tangent plane</title>
  <desc id="fig-desc">Left: the directions through the origin for z = xy over the square root of x squared plus y squared; the function is positive in two opposite sectors and negative in the other two. Right: along the axes z = 0, while along the diagonals z = r/2 and z = -r/2, so the slope at the origin depends on the direction.</desc>
  <rect width="340" height="210" fill="#FFFFFF" />
  <circle cx="96" cy="98" r="62" fill="#E8EFF5" fill-opacity="0.30" stroke="#778B9C" stroke-width="1" />
  <line x1="24" y1="98" x2="168" y2="98" stroke="#AAB8C4" stroke-width="1" />
  <line x1="96" y1="26" x2="96" y2="170" stroke="#AAB8C4" stroke-width="1" />
  <line x1="52.16" y1="141.84" x2="139.84" y2="54.16" stroke="#2465A8" stroke-width="1.5" />
  <line x1="52.16" y1="54.16" x2="139.84" y2="141.84" stroke="#B45319" stroke-width="1.5" />
  <text x="174" y="102" font-size="12" fill="#46596A">x</text>
  <text x="88" y="22" font-size="12" fill="#46596A" text-anchor="end">y</text>
  <text x="133" y="91" font-size="11" fill="#2465A8" text-anchor="middle">f &gt; 0</text>
  <text x="59" y="91" font-size="11" fill="#B45319" text-anchor="middle">f &lt; 0</text>
  <text x="133" y="114" font-size="11" fill="#B45319" text-anchor="middle">f &lt; 0</text>
  <text x="59" y="114" font-size="11" fill="#2465A8" text-anchor="middle">f &gt; 0</text>
  <text x="144.84" y="51.16" font-size="11" fill="#2465A8">y = x</text>
  <text x="48" y="48" font-size="11" fill="#B45319" text-anchor="middle">y = −x</text>
  <circle cx="96" cy="98" r="3" fill="#182735" stroke="#182735" stroke-width="1.6" />
  <text x="96" y="198" font-size="11" fill="#46596A" text-anchor="middle">Sign in each quadrant</text>
  <line x1="222" y1="100" x2="332" y2="100" stroke="#AAB8C4" stroke-width="1" />
  <line x1="228" y1="170" x2="228" y2="36" stroke="#AAB8C4" stroke-width="1" />
  <path d="M 332 100 L 327 102.1 L 327 97.9 Z" fill="#182735" stroke="none" />
  <path d="M 228 36 L 230.1 41 L 225.9 41 Z" fill="#182735" stroke="none" />
  <text x="328" y="117" font-size="12" fill="#46596A" text-anchor="end">r</text>
  <text x="221" y="44" font-size="12" fill="#46596A" text-anchor="end">z</text>
  <line x1="228" y1="100" x2="290" y2="100" stroke="#182735" stroke-width="2.2" />
  <line x1="228" y1="100" x2="290" y2="56" stroke="#2465A8" stroke-width="2.2" />
  <line x1="228" y1="100" x2="290" y2="144" stroke="#B45319" stroke-width="2.2" />
  <text x="295" y="57" font-size="11" fill="#2465A8">y = x</text>
  <text x="295" y="148" font-size="11" fill="#B45319">y = −x</text>
  <text x="262.1" y="115" font-size="11" fill="#46596A" text-anchor="middle">axes</text>
  <text x="223" y="114" font-size="11" fill="#46596A" text-anchor="end">0</text>
  <circle cx="228" cy="100" r="3" fill="#182735" />
  <text x="290" y="44" font-size="11" fill="#2465A8" text-anchor="end">r/2</text>
  <text x="290" y="160" font-size="11" fill="#B45319" text-anchor="end">−r/2</text>
</svg>
