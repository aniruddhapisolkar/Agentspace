<svg xmlns="http://www.w3.org/2000/svg" width="330" height="268" viewBox="0 0 330 268" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
  <title id="fig-title">Stokes&#x27; theorem: one boundary, two spanning surfaces</title>
  <desc id="fig-desc">A closed curve C bounding both a flat disk S1 in a horizontal plane and a curved cap S2 above it, with upward normals n1 and n2 and boundary arrows consistent with the right-hand rule.</desc>
  <rect width="330" height="268" fill="#FFFFFF"/>
  <ellipse cx="165" cy="192" rx="100" ry="26" fill="#E9E3E2" stroke="#312F2F" stroke-width="1.3"/>
