<svg xmlns="http://www.w3.org/2000/svg" width="340" height="232" viewBox="0 0 340 232" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif">
  <title id="fig-title">A section through the tangent plane and the quadratic approximation</title>
  <desc id="fig-desc">Along the line h = (1,1) through the origin, the function e to the power x+y is compared with its first-order polynomial, a straight line, and its second-order polynomial, a parabola. Both match the value and the slope at the origin; the parabola also matches the curvature and stays closer.</desc>
