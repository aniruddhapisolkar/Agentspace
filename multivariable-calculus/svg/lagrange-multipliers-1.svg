<svg xmlns="http://www.w3.org/2000/svg" width="340" height="342" viewBox="0 0 340 342" role="img" aria-labelledby="fig-title fig-desc" font-family="Geist, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
  <title id="fig-title">A level curve tangent to the constraint circle</title>
  <desc id="fig-desc">Level curves of f(x,y) = x y and the constraint circle x squared plus y squared = 1. At the constrained maximum the level curve x y = 1/2 touches the circle and the gradients of f and g are parallel and point the same way; at the minimum x y = -1/2 they are parallel and opposite.</desc>
