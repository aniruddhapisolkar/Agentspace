  <title id="fig-title">A flat point that no Taylor polynomial detects</title>
  <desc id="fig-desc">Left: the surface e to the power minus 1 over x squared plus y squared rises away from the origin, where it equals 0 and is infinitely flat; the plane z = 0 touches it there. Right: the section e to the power minus 1 over t squared hugs the tangent line 0, so the Taylor polynomial is the zero polynomial.</desc>
